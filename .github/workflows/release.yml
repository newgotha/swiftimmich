name: Release

on:
  # Run by hand from the Actions tab (or re-enable the tag trigger below once the workflow
  # has been proven on a macOS runner that has the macOS 26 SDK).
  workflow_dispatch:
  # push:
  #   tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    # The app uses macOS 26 APIs, so it needs a runner whose Xcode includes that SDK.
    # If this image name isn't available yet, use the newest macOS runner that has it.
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4

      - name: Toolchain
        run: |
          xcodebuild -version
          swift --version

      - name: Test
        run: swift test

      - name: Set the version from the tag
        if: startsWith(github.ref, 'refs/tags/v')
        run: echo "${GITHUB_REF_NAME#v}" > VERSION

      - name: Build and package
        run: Scripts/package_release.sh

      - name: Upload the build (manual runs)
        if: ${{ !startsWith(github.ref, 'refs/tags/v') }}
        uses: actions/upload-artifact@v4
        with:
          name: SwiftImmich
          path: |
            dist/*.dmg
            dist/*.zip
            dist/SHA256SUMS.txt

      - name: Publish the release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/*.dmg
            dist/*.zip
            dist/SHA256SUMS.txt
          generate_release_notes: true
